name: vulngate
on: [pull_request]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        run: go build -o vulngate ./cmd/vulngate
      - name: Security gate (blocks merge on HIGH findings)
        run: ./vulngate scan .
