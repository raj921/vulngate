name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Test
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          go build -trimpath -ldflags="-s -w" -o vulngate ./cmd/vulngate
          tar -czf vulngate-${{ github.ref_name }}-${{ matrix.name }}.tar.gz vulngate
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: vulngate-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: vulngate-*.tar.gz
          generate_release_notes: true